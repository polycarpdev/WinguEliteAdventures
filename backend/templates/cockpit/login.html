{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Wingu Elite Cockpit</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="{% static 'site/global.css' %}">
  <link rel="stylesheet" href="{% static 'cockpit/cockpit.css' %}">
</head>
<body class="ck">
  <main class="login">
    <form method="post" class="login__card">
      {% csrf_token %}
      <img src="/brand/logo-320.webp" alt="Wingu Elite Adventures" width="320" height="294">
      <h1>Cockpit</h1>
      <p>Sign in to manage bookings and website content.</p>
      {% if form.non_field_errors %}<div class="form-alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
      <div class="field">
        <label for="id_username">Username</label>
        <input class="input" type="text" name="username" id="id_username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn--block" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
