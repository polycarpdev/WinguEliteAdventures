{% if page.paginator.num_pages > 1 %}<div class="pager"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span><div>{% if page.has_previous %}<a class="btn btn--outline btn--sm" href="{% querystring page=page.previous_page_number %}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn--outline btn--sm" href="{% querystring page=page.next_page_number %}">Next</a>{% endif %}</div></div>{% endif %}
