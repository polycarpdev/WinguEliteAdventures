{% load cockpit %}{% with w=field.field.widget.input_type %}
<div class="field{% if field.errors %} field--invalid{% endif %}{% if wide %} field--wide{% endif %}">
  {% if w == 'checkbox' %}
    <label class="check">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text|safe }}</span>{% endif %}
  {{ field.errors }}
</div>
{% endwith %}
