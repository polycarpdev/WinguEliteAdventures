{% if rows %}<ul class="bars{% if gold %} bars--gold{% endif %}">{% for r in rows %}<li><span class="bars__label" title="{{ r.label }}">{{ r.label }}</span><span class="bars__value">{{ r.value }}</span><span class="bars__track"><span class="bars__fill" style="width:{{ r.pct }}%"></span></span></li>{% endfor %}</ul>{% else %}<p class="empty-note">{{ empty|default:"No data yet." }}</p>{% endif %}
