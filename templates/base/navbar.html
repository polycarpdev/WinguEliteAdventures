{% load static %}
<nav style="background-color:#f1eee0;" class=" shadow-lg sticky top-0 z-50" x-data="{ mobileMenuOpen: false, destinationsOpen: false }">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            
            <!-- Logo -->
            <div class="flex items-center">
                <a href="{% url 'core:home' %}" class="flex items-center space-x-2">
                    <img src="{% static 'images/logo.png' %}" alt="Wingu Elite Adventures Logo" class="h-12 w-auto" onerror="this.style.display='none'">
                    <span class="text-2xl font-bold text-safari-brown">Wingu Elite Adventures</span>
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden lg:flex items-center space-x-6">
                <a href="{% url 'core:home' %}" class="text-gray-700 hover:text-safari-brown transition duration-300">Home</a>
                <a href="{% url 'core:about' %}" class="text-gray-700 hover:text-safari-brown transition duration-300">About</a>
                 
 <!-- Destinations Dropdown -->
<div class="relative inline-block" 
     x-data="{ open: false, timeout: null }"
     @mouseenter="open = true; clearTimeout(timeout)"
     @mouseleave="timeout = setTimeout(() => open = false, 100)"
     style="width: fit-content;">

    <!-- Trigger Button -->
    <button class="text-gray-700 hover:text-safari-brown transition duration-300 flex items-center space-x-1 whitespace-nowrap">
        <span>Destinations</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    <!-- Dropdown: ONLY visible when hovering button -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         @mouseenter="clearTimeout(timeout); open = true"
         @mouseleave="timeout = setTimeout(() => open = false, 100)"
         class="absolute left-0 top-full mt-1 w-48 bg-white rounded-md shadow-lg border border-gray-200 py-2 z-50"
         style="pointer-events: auto;">
        <a href="{% url 'destinations:list' 'kenya' %}" 
           class="block px-4 py-2 text-gray-700 hover:bg-safari-brown hover:text-white transition">Kenya</a>
        <a href="{% url 'destinations:list' 'international' %}" 
           class="block px-4 py-2 text-gray-700 hover:bg-safari-brown hover:text-white transition">International</a>
    </div>

    <!-- Invisible bridge: 8px tall, SAME WIDTH as button -->
    <div class="absolute left-0 right-0 h-2 -mt-2 pointer-events-none"></div>
</div>          
                <a href="{% url 'itineraries:list' %}" class="text-gray-700 hover:text-safari-brown transition duration-300">Itineraries</a>
                <a href="{% url 'gallery:index' %}" class="text-gray-700 hover:text-safari-brown transition duration-300">Gallery</a>
                <a href="{% url 'blog:list' %}" class="text-gray-700 hover:text-safari-brown transition duration-300">Blog</a>
                <a href="{% url 'core:faqs' %}" class="text-gray-700 hover:text-safari-brown transition duration-300">FAQs</a>
                 
                <!-- Contact CTA -->
                <a href="{% url 'contact:contact' %}" class="bg-safari-brown text-white px-6 py-2 rounded-full hover:bg-safari-gold transition duration-300 shadow-md">Contact</a>
            </div>
            
            <!-- Mobile Menu Button -->
            <div class="lg:hidden flex items-center space-x-4">
                <a href="{% url 'contact:contact' %}" class="bg-safari-brown text-white px-4 py-2 rounded-full text-sm hover:bg-safari-gold transition duration-300">Contact</a>
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-gray-700 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 transform -translate-y-4"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             class="lg:hidden pb-4">
            <a href="{% url 'core:home' %}" class="block py-2 text-gray-700 hover:text-safari-brown transition duration-300">Home</a>
            <a href="{% url 'core:about' %}" class="block py-2 text-gray-700 hover:text-safari-brown transition duration-300">About</a>
             
            <!-- Mobile Destinations -->
            <div x-data="{ mobileDestOpen: false }">
                <button @click="mobileDestOpen = !mobileDestOpen" class="w-full text-left py-2 text-gray-700 hover:text-safari-brown transition duration-300 flex justify-between items-center">
                    <span>Destinations</span>
                    <svg class="w-4 h-4" :class="{ 'transform rotate-180': mobileDestOpen }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div x-show="mobileDestOpen" class="pl-4">
                    <a href="{% url 'destinations:list' 'kenya' %}" class="block py-2 text-gray-600 hover:text-safari-brown transition duration-300">Kenya</a>
                    <a href="{% url 'destinations:list' 'international' %}" class="block py-2 text-gray-600 hover:text-safari-brown transition duration-300">International</a>
                </div>
            </div>
            
            <a href="{% url 'itineraries:list' %}" class="block py-2 text-gray-700 hover:text-safari-brown transition duration-300">Itineraries</a>
            <a href="{% url 'gallery:index' %}" class="block py-2 text-gray-700 hover:text-safari-brown transition duration-300">Gallery</a>
            <a href="{% url 'blog:list' %}" class="block py-2 text-gray-700 hover:text-safari-brown transition duration-300">Blog</a>
            <a href="{% url 'core:faqs' %}" class="block py-2 text-gray-700 hover:text-safari-brown transition duration-300">FAQs</a>
         </div>
    </div>
</nav>
