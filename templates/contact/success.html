{% extends 'base/base.html' %}
{% load static %}

{% block title %}Message Sent - Wingu Elite Adventures{% endblock %}

{% block content %}

<section class="py-20 container mx-auto px-4">
    <div class="max-w-2xl mx-auto text-center">
        <div class="mb-8">
            <svg class="w-24 h-24 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Message Sent Successfully!</h1>
        <p class="text-xl text-gray-600 mb-8">Thank you for contacting us. We'll respond to your message as soon as possible.</p>
        <div class="space-x-4">
            <a href="{% url 'core:home' %}" class="inline-block bg-safari-brown text-white px-8 py-3 rounded-full hover:bg-safari-gold transition duration-300">Go to Homepage</a>
            <a href="{% url 'contact:contact' %}" class="inline-block bg-gray-200 text-gray-800 px-8 py-3 rounded-full hover:bg-gray-300 transition duration-300">Send Another Message</a>
        </div>
    </div>
</section>

{% endblock %}
